name: Contrast (WCAG)

# Der Kontrast-Waechter als Pflichtpruefung — eigener Arbeitsablauf, kein Spec in
# der Playwright-Suite.
#
# WARUM ER ERST JETZT SCHARF STEHT. Bis zur Reparatur trug die Seite 355 zu dunkle
# Textstellen. Ein Tor davor haette main dauerhaft rot gefaerbt und damit jeden unter
# Zeitdruck dazu eingeladen, es wieder auszubauen. Der Founder-Entscheid vom
# 2026-08-21 lautet deshalb: erst bauen und rot gegenproben, dann reparieren, dann
# hart schalten — AUSDRUECKLICH OHNE geduldete Altlastenliste. Eine solche Liste
# machte den Waechter beim ersten Lauf gruen und entwertete die einzige Rotprobe,
# die er je umsonst bekommt.
#
# WARUM JETZT UND NICHT SPAETER. Der Waechter steht auf einer beweisbaren Null. Das
# ist die einzige Schwelle, die nicht wackelt: "weniger als letztes Mal" ist keine.
# Jede Woche ohne Tor bringt neue Stellen zurueck, und dann ist die Ausnahmeliste
# unvermeidlich.
#
# WARUM KEIN EIGENER BAU-SCHRITT wie in lighthouse.yml. Der Befehl baut und bedient
# sich selbst (`npm run check:contrast`), samt Warten auf den antwortenden Server und
# sauberem Abraeumen der Prozessgruppe. Genau dieser Befehl laeuft auch lokal — ein
# zweiter Pfad in der CI waere ein zweiter Ort, an dem etwas anders sein kann.
#
# AUSSTIEGSCODES: 0 sauber · 1 Befunde · 2 der Lauf konnte nicht belegen, was er
# gemessen hat (Farbmodus hat nicht gegriffen, Adressliste leer, Seite antwortet
# nicht). Beide roten Faelle sollen das Tor schliessen: ein Lauf, der seinen eigenen
# Gegenstand nicht beweisen kann, ist kein gruener Lauf.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Ueberholte PR-Laeufe abbrechen; jeder Push auf main laeuft zu Ende, damit jeder
  # Hauptstand seine eigene Messung behaelt.
  group: contrast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contrast:
    name: Contrast (WCAG, alle Adressen, beide Farbmodi)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Kontrast-Waechter (baut, bedient und misst sich selbst)
        run: npm run check:contrast
